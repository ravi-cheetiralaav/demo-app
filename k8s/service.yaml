apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
spec:
  type: ClusterIP # change to LoadBalancer/NodePort or add an Ingress for external access
  selector:
    app.kubernetes.io/name: demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
